[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "f32c-neck-motors"
version = "0.1.1"
description = "F32C motor and ZED Mini SDK with bundled Linux native libraries"
readme = "docs/SDK使用说明.md"
requires-python = ">=3.10"

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]
