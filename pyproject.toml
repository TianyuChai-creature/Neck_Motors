[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "f32c-neck-motors"
version = "0.6.0"
description = "Two-axis F32C neck: non-blocking serial link and a simple smooth-follow controller"
readme = "readme.md"
requires-python = ">=3.10"

[tool.setuptools]
packages = ["neck"]
