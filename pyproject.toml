[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "f32c-neck-motors"
version = "0.4.0"
description = "Two-axis F32C neck: a driver layer for the motors and a control layer for safe motion"
readme = "readme.md"
requires-python = ">=3.10"

[tool.setuptools]
packages = ["neck", "neck.driver", "neck.control"]
